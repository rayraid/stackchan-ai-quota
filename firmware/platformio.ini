; aihelper 固件：M5Stack StackChan（CoreS3 主机）
; 编译烧录：../.venv/bin/pio run -t upload

[env:stackchan]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5Unified
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager
  https://github.com/m5stack/StackChan-BSP.git
extra_scripts = pre:scripts/gen_config.py
