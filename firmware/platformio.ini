; aihelper 固件 2.0：M5Stack StackChan（CoreS3 主机）
; 编译烧录：../.venv/bin/pio run -t upload
; 不再需要编译前写配置：WiFi、口令、Mac 的位置由 Mac 上的安装向导通过 USB 写进机器人。

[env:stackchan]
platform = espressif32
board = m5stack-cores3
framework = arduino
monitor_speed = 115200
board_build.partitions = partitions.csv
; 平滑字体（tools/make_fonts.py 生成）直接嵌进固件
board_build.embed_files =
  fonts/cn14.vlw
  fonts/cn16.vlw
  fonts/cn18b.vlw
  fonts/cn26b.vlw
  fonts/cn38b.vlw
  fonts/jp14.vlw
  fonts/jp16.vlw
  fonts/jp18b.vlw
  fonts/jp26b.vlw
  fonts/jp38b.vlw
  fonts/num15b.vlw
  fonts/num18.vlw
  fonts/num22b.vlw
  fonts/num28b.vlw
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  m5stack/M5Unified
  bblanchon/ArduinoJson@^7
  tzapu/WiFiManager
  https://github.com/m5stack/StackChan-BSP.git
